name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Lets anyone with access rebuild from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Publishing the APK (and the Play bundle) as a release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads its Android runtime jars from Maven Central on first use, outside
      # Gradle's cache. Keeping them here stops a network blip from failing every UI and Room test.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      # The two fixed signing keys:
      # - SIGNING_KEYSTORE_BASE64 signs the GitHub APK (flavor "sideload"). Without it every build
      #   would get a new random key, Android would refuse to update over the installed app, and
      #   reinstalling would wipe people's training history.
      # - SIGNING_UPLOAD_KEYSTORE_BASE64 (+ UPLOAD_STORE_PASSWORD, alias "upload"; a PKCS12
      #   key uses the store password for the key too) signs the Google Play bundle (flavor "play").
      #   Without both secrets the bundle is signed with a throwaway debug key and is not attached
      #   to the release.
      - name: Add the signing keys
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SIGNING_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/boratreino-release.keystore
            echo "Signing key added"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: builds use a throwaway key and no release is published."
          fi
          if [ -n "$SIGNING_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$UPLOAD_STORE_PASSWORD" ]; then
            printf '%s' "$SIGNING_UPLOAD_KEYSTORE_BASE64" | base64 -d > app/boratreino-upload.keystore
            echo "Upload key added"
          else
            echo "::warning::SIGNING_UPLOAD_KEYSTORE_BASE64 or UPLOAD_STORE_PASSWORD is not set: the Google Play bundle is signed with a throwaway key and not attached to the release."
          fi

      - name: Translations are complete
        run: python3 translations/i18n.py check

      - name: Module structure rules tests
        run: ./gradlew -p build-logic :rules:test

      # Every Gradle invocation also checks the module structure (boratreino.module-rules).
      - name: Unit tests
        run: ./gradlew :core:model:test testDebugUnitTest

      # Room writes the database schema while compiling; it must be committed (CLAUDE.md, "Data").
      # On a mismatch the generated files are printed so they can be copied into the repo.
      - name: Room schemas are committed
        # Also after failed tests: a new schema version's migration test fails until its schema is committed.
        if: always()
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::core/database/schemas differs from what Room generated; commit the files below."
            git status --porcelain core/database/schemas
            find core/database/schemas -name '*.json' -exec sh -c 'echo "=== $1"; cat "$1"; echo "=== end"' _ {} \;
            exit 1
          fi

      # Pictures of the screens that the UI tests draw (Roborazzi), for checking the layout.
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find . -path '*/build/outputs/roborazzi/*.png' -exec cp {} screenshots/ \;
          ls screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          # The release keeps the files; the artifact is only a short-lived copy (Actions storage is limited).
          retention-days: 2

      # sideload = the GitHub APK (with the updater); play = the Google Play bundle (no updater,
      # no network). assemblePlayDebug makes sure the play flavor also compiles as an APK.
      # The upload passwords are only read when app/boratreino-upload.keystore exists.
      - name: Build the APK and the bundle
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: ./gradlew assembleSideloadDebug assembleSideloadRelease assemblePlayDebug bundlePlayRelease

      # Google Play forbids apps that update themselves or that don't need the network from asking
      # for it: the play build must carry neither permission.
      - name: Play build has no updater permissions
        run: |
          manifest=$(find app/build -path '*merged_manifests/playRelease*' -name AndroidManifest.xml | head -n1)
          if [ -z "$manifest" ]; then
            echo "::warning::Merged manifest of the play release not found; permissions not checked."
            exit 0
          fi
          if grep -E 'android.permission.(INTERNET|REQUEST_INSTALL_PACKAGES)' "$manifest"; then
            echo "::error::The play build declares INTERNET or REQUEST_INSTALL_PACKAGES ($manifest)."
            exit 1
          fi
          echo "Play manifest is clean"

      - uses: actions/upload-artifact@v4
        with:
          name: boratreino-debug-apk
          path: app/build/outputs/apk/sideload/debug/*.apk
          retention-days: 2

      # Signed with the upload key when the secrets exist, otherwise with a throwaway key: never
      # upload that one to Google Play.
      - uses: actions/upload-artifact@v4
        with:
          name: boratreino-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          retention-days: 2

      # One release per build, tagged v0.<build>, so update apps such as Obtainium see a new
      # version each time. GitHub's fixed link always serves the newest one:
      # https://github.com/<owner>/<repo>/releases/latest/download/BoraTreino.apk
      - name: Publish a release
        if: github.event_name == 'push' && (github.ref_name == 'claude/gym-tracking-app-pyg6li' || github.ref_name == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f app/boratreino-release.keystore ]; then
            echo "::warning::Not publishing: the SIGNING_KEYSTORE_BASE64 secret is missing, so this APK couldn't update an installed copy."
            exit 0
          fi
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk BoraTreino.apk
          assets="BoraTreino.apk"
          # The Google Play bundle goes along only when it was signed with the real upload key.
          if [ -f app/boratreino-upload.keystore ]; then
            cp app/build/outputs/bundle/playRelease/app-play-release.aab BoraTreino.aab
            assets="$assets BoraTreino.aab"
          else
            echo "::warning::BoraTreino.aab is not attached: the upload key secrets are missing."
          fi
          if ls screenshots/*.png >/dev/null 2>&1; then
            (cd screenshots && zip -q ../screenshots.zip *.png)
            assets="$assets screenshots.zip"
          fi
          gh release create "v0.${GITHUB_RUN_NUMBER}" $assets \
            --target "$GITHUB_SHA" \
            --title "Bora pro Treino! 0.${GITHUB_RUN_NUMBER}" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Install BoraTreino.apk on Android; it updates over any earlier build." \
            --latest
          # Keep the three newest releases.
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | xargs -r -n1 gh release delete --cleanup-tag --yes
